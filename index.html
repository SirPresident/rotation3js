<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,

                 user-scalable=no"
    >

    <title>3D Star Field</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;

            background: #03050a;

            color: white;

            font-family: Arial, sans-serif;
        }


        /* -------------------------------------------------------
           UI

        #ui {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 10;

            padding: 16px;

            text-align: center;

            background: rgba(3, 5, 10, 0.72);

            backdrop-filter: blur(12px);
        }


        #title {

            font-size: 20px;

            font-weight: bold;

        }


        #status {

            font-size: 13px;

            color: #aeb6c4;

            margin-bottom: 12px;
        }


        button {

            border: none;

            border-radius: 10px;

            font-size: 14px;

            font-weight: bold;

            background: white;

            color: #111;

            cursor: pointer;

        }


        .value strong {

            display: block;

            margin-top: 2px;

            color: white;

            font-size: 13px;
        }

    </style>

</head>


<body>


<!-- ============================================================
     UI
============================================================ -->

<div id="ui">

    <div id="title">
        3D Star Field
    </div>


    <div id="status">
        Motion sensor not enabled
    </div>


    <div>

        <button id="enableButton">
            Enable Motion Sensor
        </button>

        <button id="calibrateButton">
            Recalibrate
        </button>

    </div>


    <div id="values">

        <div class="value">
            ALPHA
            <strong id="alpha">0°</strong>
        </div>

        <div class="value">
            BETA
            <strong id="beta">0°</strong>
        </div>

        <div class="value">
            GAMMA
            <strong id="gamma">0°</strong>
        </div>

        <div class="value">
            SENSITIVITY
            <strong id="sensitivity">30%</strong>
        </div>

    </div>

</div>


<script type="module">


    // ============================================================
    // THREE.JS
    // ============================================================

    import * as THREE from
        "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js";


    // ============================================================
    // SETTINGS
    // ============================================================


    /*
     * How much phone rotation is transferred to
     * the star field.
     *
     * 1.00 = full rotation
     * 0.50 = half rotation
     * 0.30 = subtle
     * 0.15 = very subtle
     */

    const ROTATION_SENSITIVITY = 0.30;


    /*
     * How quickly the star field follows the phone.
     */

    const SMOOTHING = 0.16;


    /*
     * Number of stars.
     *
     * Modern phones should handle 1500 comfortably.
     */

    const STAR_COUNT = 1500;


    /*
     * Radius of the 3D star volume.
     */

    const STAR_RADIUS = 7.5;


    // ============================================================
    // SCENE
    // ============================================================

    const scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x03050a
        );


    // ============================================================
    // CAMERA
    // ============================================================

    const camera =
        new THREE.PerspectiveCamera(
            55,

            window.innerWidth /
            window.innerHeight,

            0.1,

            100
        );


    /*
     * The camera is outside the star volume.
     *
     * This is important because perspective makes
     * nearby and distant stars behave differently.
     */

    camera.position.set(
        0,
        0,
        12
    );


    // ============================================================
    // RENDERER
    // ============================================================

    const renderer =
        new THREE.WebGLRenderer({

            antialias: true,

            powerPreference: "high-performance"
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    document.body.appendChild(
        renderer.domElement
    );


    // ============================================================
    // STAR FIELD GROUP
    // ============================================================

    /*
     * Every star belongs to this group.
     *
     * When the group rotates using a quaternion,
     * the entire 3D structure rotates.
     */

    const starField =
        new THREE.Group();


    scene.add(
        starField
    );


    // ============================================================
    // STAR DATA
    // ============================================================

    const positions =
        new Float32Array(
            STAR_COUNT * 3
        );


    const sizes =
        new Float32Array(
            STAR_COUNT
        );


    const brightness =
        new Float32Array(
            STAR_COUNT
        );


    const twinkle =
        new Float32Array(
            STAR_COUNT
        );


    const phases =
        new Float32Array(
            STAR_COUNT
        );


    // ============================================================
    // CREATE 3D STAR DISTRIBUTION
    // ============================================================

    for (
        let i = 0;
        i < STAR_COUNT;
        i++
    ) {


        /*
         * Uniform-ish distribution inside a sphere.
         *
         * This gives us actual 3D depth rather than
         * just putting stars on a flat screen.
         */

        const theta =
            Math.random() *
            Math.PI * 2;


        const phi =
            Math.acos(
                2 * Math.random() - 1
            );


        /*
         * Cubic-root distribution keeps the
         * volume looking natural.
         */

        const radius =
            STAR_RADIUS *
            Math.cbrt(
                Math.random()
            );


        const sinPhi =
            Math.sin(phi);


        const x =
            radius *
            sinPhi *
            Math.cos(theta);


        const y =
            radius *
            sinPhi *
            Math.sin(theta);


        const z =
            radius *
            Math.cos(phi);


        positions[i * 3] =
            x;

        positions[i * 3 + 1] =
            y;

        positions[i * 3 + 2] =
            z;


        /*
         * Different intrinsic star sizes.
         *
         * The shader additionally makes them
         * appear larger when they are physically
         * closer to the camera.
         */

        sizes[i] =
            0.7 +
            Math.random() * 2.0;


        /*
         * Different brightness.
         */

        brightness[i] =
            0.45 +
            Math.random() * 0.75;


        /*
         * How quickly this individual star twinkles.
         */

        twinkle[i] =
            0.25 +
            Math.random() * 1.25;


        /*
         * Random phase prevents all stars
         * from twinkling together.
         */

        phases[i] =
            Math.random() *
            Math.PI * 2;
    }


    // ============================================================
    // BUFFER GEOMETRY
    // ============================================================

    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(
        "position",

        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    geometry.setAttribute(
        "aSize",

        new THREE.BufferAttribute(
            sizes,
            1
        )
    );


    geometry.setAttribute(
        "aBrightness",

        new THREE.BufferAttribute(
            brightness,
            1
        )
    );


    geometry.setAttribute(
        "aTwinkle",

        new THREE.BufferAttribute(
            twinkle,
            1
        )
    );


    geometry.setAttribute(
        "aPhase",

        new THREE.BufferAttribute(
            phases,
            1
        )
    );


    // ============================================================
    // STAR SHADER
    // ============================================================

    /*
     * A custom shader gives us:
     *
     * - soft glowing stars
     * - different sizes
     * - depth-based size
     * - individual twinkle
     * - additive light-like appearance
     */


    const starMaterial =
        new THREE.ShaderMaterial({

            transparent: true,

            depthWrite: false,

            depthTest: true,

            blending:
                THREE.AdditiveBlending,


            uniforms: {

                uTime: {
                    value: 0
                }

            },


            vertexShader: `

                uniform float uTime;

                attribute float aSize;
                attribute float aBrightness;
                attribute float aTwinkle;
                attribute float aPhase;

                varying float vBrightness;


                void main() {

                    vec4 mvPosition =
                        modelViewMatrix *
                        vec4(position, 1.0);


                    /*
                     * Distance from the camera.
                     */

                    float depth =
                        max(
                            1.0,
                            -mvPosition.z
                        );


                    /*
                     * Subtle individual twinkle.
                     */

                    float sparkle =
                        0.88 +
                        0.12 *
                        sin(
                            uTime *
                            aTwinkle +
                            aPhase
                        );


                    /*
                     * Perspective:
                     *
                     * closer stars appear larger
                     * farther stars appear smaller.
                     */

                    float perspectiveSize =
                        42.0 /
                        depth;


                    gl_PointSize =
                        aSize *
                        perspectiveSize *
                        sparkle;


                    /*
                     * Prevent one extremely close
                     * star from becoming enormous.
                     */

                    gl_PointSize =
                        min(
                            gl_PointSize,
                            18.0
                        );


                    vBrightness =
                        aBrightness *
                        sparkle;


                    gl_Position =
                        projectionMatrix *
                        mvPosition;
                }

            `,


            fragmentShader: `


                varying float vBrightness;


                void main() {


                    /*
                     * Distance from the center of
                     * this point sprite.
                     */

                    vec2 uv =
                        gl_PointCoord -
                        vec2(0.5);


                    float distanceFromCenter =
                        length(uv);


                    /*
                     * Soft circular glow.
                     */

                    float glow =
                        1.0 -
                        smoothstep(
                            0.0,
                            0.5,
                            distanceFromCenter
                        );


                    /*
                     * Strong bright core.
                     */

                    float core =
                        1.0 -
                        smoothstep(
                            0.0,
                            0.16,
                            distanceFromCenter
                        );


                    /*
                     * Combine glow + core.
                     */

                    float alpha =
                        glow *
                        0.55 +
                        core *
                        0.45;


                    /*
                     * Slightly cool-white stars.
                     */

                    vec3 color =
                        mix(
                            vec3(
                                0.82,
                                0.90,
                                1.0
                            ),

                            vec3(
                                1.0,
                                1.0,
                                0.94
                            ),

                            core
                        );


                    color *=
                        vBrightness;


                    gl_FragColor =
                        vec4(
                            color,
                            alpha *
                            vBrightness
                        );
                }

            `
        });


    // ============================================================
    // CREATE POINT CLOUD
    // ============================================================

    const stars =
        new THREE.Points(
            geometry,
            starMaterial
        );


    starField.add(
        stars
    );


    // ============================================================
    // QUATERNIONS
    // ============================================================

    const deviceQuaternion =
        new THREE.Quaternion();


    const calibrationQuaternion =
        new THREE.Quaternion();


    const inverseCalibration =
        new THREE.Quaternion();


    const relativeQuaternion =
        new THREE.Quaternion();


    const reducedQuaternion =
        new THREE.Quaternion();


    const targetQuaternion =
        new THREE.Quaternion();


    const euler =
        new THREE.Euler();


    const screenQuaternion =
        new THREE.Quaternion();


    const identityQuaternion =
        new THREE.Quaternion();


    /*
     * Device coordinate system → Three.js
     * coordinate system.
     */

    const DEVICE_TO_THREE =
        new THREE.Quaternion(

            -Math.sqrt(0.5),

            0,

            0,

            Math.sqrt(0.5)
        );


    const SCREEN_AXIS =
        new THREE.Vector3(
            0,
            0,
            1
        );


    let calibrated =
        false;


    let sensorEnabled =
        false;


    // ============================================================
    // UI
    // ============================================================

    const enableButton =
        document.getElementById(
            "enableButton"
        );


    const calibrateButton =
        document.getElementById(
            "calibrateButton"
        );


    const status =
        document.getElementById(
            "status"
        );


    const alphaDisplay =
        document.getElementById(
            "alpha"
        );


    const betaDisplay =
        document.getElementById(
            "beta"
        );


    const gammaDisplay =
        document.getElementById(
            "gamma"
        );


    // ============================================================
    // SCREEN ROTATION
    // ============================================================

    function getScreenAngle() {


        if (

            screen.orientation &&

            typeof screen.orientation.angle ===
                "number"

        ) {

            return screen.orientation.angle;

        }


        if (

            typeof window.orientation ===
                "number"

        ) {

            return window.orientation;

        }


        return 0;
    }


    // ============================================================
    // BUILD DEVICE QUATERNION
    // ============================================================

    function updateDeviceQuaternion(
        event
    ) {


        if (

            event.alpha === null ||

            event.beta === null ||

            event.gamma === null

        ) {

            return;
        }


        /*
         * Convert degrees → radians.
         */

        const alpha =
            THREE.MathUtils.degToRad(
                event.alpha
            );


        const beta =
            THREE.MathUtils.degToRad(
                event.beta
            );


        const gamma =
            THREE.MathUtils.degToRad(
                event.gamma
            );


        /*
         * Convert the sensor angles into
         * ONE quaternion.
         *
         * We deliberately do not independently
         * rotate X, Y and Z.
         */

        euler.set(

            beta,

            alpha,

            -gamma,

            "YXZ"
        );


        deviceQuaternion
            .setFromEuler(
                euler
            );


        /*
         * Convert Android/device coordinates
         * into Three.js coordinates.
         */

        deviceQuaternion.multiply(
            DEVICE_TO_THREE
        );


        /*
         * Compensate for portrait/landscape
         * screen rotation.
         */

        const screenAngle =
            THREE.MathUtils.degToRad(
                getScreenAngle()
            );


        screenQuaternion
            .setFromAxisAngle(

                SCREEN_AXIS,

                -screenAngle
            );


        deviceQuaternion.multiply(
            screenQuaternion
        );


        // ========================================================
        // CALIBRATION
        // ========================================================

        if (!calibrated) {

            calibrationQuaternion
                .copy(
                    deviceQuaternion
                );


            inverseCalibration
                .copy(
                    calibrationQuaternion
                )
                .invert();


            calibrated = true;
        }


        /*
         * Rotation relative to the calibrated
         * starting position.
         */

        relativeQuaternion
            .copy(
                inverseCalibration
            )
            .multiply(
                deviceQuaternion
            );


        // ========================================================
        // REDUCE ROTATION SENSITIVITY
        // ========================================================

        /*
         * Instead of using the full measured
         * quaternion, interpolate from identity.
         *
         * 0.30 = 30% of physical rotation.
         */

        reducedQuaternion
            .copy(
                identityQuaternion
            )
            .slerp(
                relativeQuaternion,
                ROTATION_SENSITIVITY
            );


        targetQuaternion.copy(
            reducedQuaternion
        );


        // ========================================================
        // SMOOTH ROTATION
        // ========================================================

        starField.quaternion.slerp(

            targetQuaternion,

            SMOOTHING
        );


        // ========================================================
        // SENSOR DISPLAY
        // ========================================================

        alphaDisplay.textContent =
            Math.round(
                event.alpha
            ) + "°";


        betaDisplay.textContent =
            Math.round(
                event.beta
            ) + "°";


        gammaDisplay.textContent =
            Math.round(
                event.gamma
            ) + "°";
    }


    // ============================================================
    // ENABLE SENSOR
    // ============================================================

    async function enableOrientation() {


        try {


            if (

                typeof DeviceOrientationEvent ===
                    "undefined"

            ) {

                throw new Error(
                    "Device orientation is not supported."
                );
            }


            /*
             * Some browsers expose an explicit
             * permission API.
             */

            if (

                typeof DeviceOrientationEvent
                    .requestPermission ===
                    "function"

            ) {


                const permission =

                    await DeviceOrientationEvent
                        .requestPermission();


                if (
                    permission !==
                    "granted"
                ) {

                    throw new Error(
                        "Motion permission was denied."
                    );
                }
            }


            /*
             * Start listening to orientation.
             */

            window.addEventListener(

                "deviceorientation",

                updateDeviceQuaternion,

                true
            );


            sensorEnabled =
                true;


            calibrated =
                false;


            enableButton.disabled =
                true;


            enableButton.textContent =
                "Sensor Enabled";


            status.textContent =
                "Rotate your phone and explore the 3D depth.";


        }

        catch (error) {


            console.error(
                error
            );


            status.textContent =
                error.message ||

                "Could not access the motion sensor.";
        }
    }


    enableButton.addEventListener(

        "click",

        enableOrientation
    );


    // ============================================================
    // MANUAL RECALIBRATION
    // ============================================================

    calibrateButton.addEventListener(

        "click",

        () => {


            if (!sensorEnabled) {

                status.textContent =
                    "Enable the motion sensor first.";

                return;
            }


            calibrated =
                false;


            status.textContent =
                "Calibration reset — hold the phone in your desired neutral position.";
        }
    );


    // ============================================================
    // RESIZE
    // ============================================================

    window.addEventListener(

        "resize",

        () => {


            camera.aspect =

                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(

                window.innerWidth,
                window.innerHeight
            );
        }
    );


    // ============================================================
    // ANIMATION
    // ============================================================

    const clock =
        new THREE.Clock();


    function animate() {


        requestAnimationFrame(
            animate
        );


        /*
         * Continuous subtle twinkle.
         */

        starMaterial.uniforms.uTime.value =
            clock.getElapsedTime();


        renderer.render(
            scene,
            camera
        );
    }


    animate();


</script>

</body>

</html>
```
