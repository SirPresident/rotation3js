<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Three.js Phone Orientation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #101318;
            color: white;
            font-family: Arial, sans-serif;
        }

        #ui {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;

            padding: 16px;

            background: rgba(16, 19, 24, 0.85);
            backdrop-filter: blur(10px);

            text-align: center;
        }

        #title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #status {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 10px;
        }

        button {
            border: none;
            border-radius: 10px;

            padding: 13px 20px;

            font-size: 15px;
            font-weight: bold;

            background: white;
            color: #111;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        #values {
            margin-top: 12px;

            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .value {
            min-width: 72px;

            padding: 7px;

            border-radius: 8px;

            background: rgba(255,255,255,0.08);

            font-size: 11px;
            color: #aaa;
        }

        .value strong {
            display: block;
            margin-top: 3px;

            font-size: 14px;
            color: white;
        }
    </style>
</head>

<body>

<div id="ui">

    <div id="title">
        Three.js Phone Orientation
    </div>

    <div id="status">
        Sensor not enabled
    </div>

    <button id="enableButton">
        Enable Motion Sensor
    </button>

    <div id="values">

        <div class="value">
            ALPHA
            <strong id="alpha">0°</strong>
        </div>

        <div class="value">
            BETA
            <strong id="beta">0°</strong>
        </div>

        <div class="value">
            GAMMA
            <strong id="gamma">0°</strong>
        </div>

        <div class="value">
            SCREEN
            <strong id="screenAngle">0°</strong>
        </div>

    </div>

</div>


<script type="module">

    import * as THREE from
        "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js";


    // ============================================================
    // ROTATION SETTINGS
    // ============================================================

    /*
     * How much of the phone's physical rotation should be
     * transferred to the 3D model.
     *
     * 1.00 = full rotation
     * 0.75 = 75% of the rotation
     * 0.50 = half the rotation
     * 0.35 = 35% of the rotation
     * 0.20 = very subtle movement
     */

    const ROTATION_SENSITIVITY = 0.2;


    /*
     * How quickly the model follows the target orientation.
     *
     * Higher = more responsive
     * Lower = smoother / slower
     */

    const SMOOTHING = 0.18;


    // ============================================================
    // THREE.JS SETUP
    // ============================================================

    const scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x101318);


    const camera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            100
        );

    camera.position.set(0, 0, 4);


    const renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    document.body.appendChild(
        renderer.domElement
    );


    // ============================================================
    // LIGHTING
    // ============================================================

    const ambientLight =
        new THREE.AmbientLight(
            0xffffff,
            2
        );

    scene.add(ambientLight);


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    light.position.set(
        2,
        4,
        5
    );

    scene.add(light);


    // ============================================================
    // SIMPLE 3D PHONE
    // Replace this later with Leo.glb
    // ============================================================

    const phone =
        new THREE.Group();

    scene.add(phone);


    const bodyGeometry =
        new THREE.BoxGeometry(
            1.6,
            3.2,
            0.18
        );

    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x222831,
            metalness: 0.7,
            roughness: 0.25
        });

    const body =
        new THREE.Mesh(
            bodyGeometry,
            bodyMaterial
        );

    phone.add(body);


    const screenGeometry =
        new THREE.BoxGeometry(
            1.42,
            2.82,
            0.035
        );

    const screenMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x17202a,
            metalness: 0.1,
            roughness: 0.15
        });

    const screen =
        new THREE.Mesh(
            screenGeometry,
            screenMaterial
        );

    screen.position.z = 0.11;

    phone.add(screen);


    const leoGeometry =
        new THREE.PlaneGeometry(
            1,
            1
        );

    const leoMaterial =
        new THREE.MeshBasicMaterial({
            color: 0x5f8dd3,
            side: THREE.DoubleSide
        });

    const leo =
        new THREE.Mesh(
            leoGeometry,
            leoMaterial
        );

    leo.position.z = 0.14;

    phone.add(leo);


    // ============================================================
    // QUATERNIONS
    // ============================================================

    const deviceQuaternion =
        new THREE.Quaternion();

    const calibrationQuaternion =
        new THREE.Quaternion();

    const inverseCalibration =
        new THREE.Quaternion();

    const relativeQuaternion =
        new THREE.Quaternion();

    const reducedQuaternion =
        new THREE.Quaternion();

    const targetQuaternion =
        new THREE.Quaternion();

    const euler =
        new THREE.Euler();

    const screenQuaternion =
        new THREE.Quaternion();

    const identityQuaternion =
        new THREE.Quaternion();


    // Device coordinate system → Three.js coordinate system

    const DEVICE_TO_THREE =
        new THREE.Quaternion(
            -Math.sqrt(0.5),
            0,
            0,
            Math.sqrt(0.5)
        );


    const SCREEN_AXIS =
        new THREE.Vector3(
            0,
            0,
            1
        );


    let calibrated = false;


    // ============================================================
    // UI
    // ============================================================

    const enableButton =
        document.getElementById(
            "enableButton"
        );

    const status =
        document.getElementById(
            "status"
        );

    const alphaDisplay =
        document.getElementById(
            "alpha"
        );

    const betaDisplay =
        document.getElementById(
            "beta"
        );

    const gammaDisplay =
        document.getElementById(
            "gamma"
        );

    const screenDisplay =
        document.getElementById(
            "screenAngle"
        );


    // ============================================================
    // SCREEN ORIENTATION
    // ============================================================

    function getScreenAngle() {

        if (
            screen.orientation &&
            typeof screen.orientation.angle === "number"
        ) {
            return screen.orientation.angle;
        }

        if (
            typeof window.orientation === "number"
        ) {
            return window.orientation;
        }

        return 0;
    }


    // ============================================================
    // DEVICE ORIENTATION
    // ============================================================

    function updateDeviceQuaternion(event) {

        if (
            event.alpha === null ||
            event.beta === null ||
            event.gamma === null
        ) {
            return;
        }


        const alpha =
            THREE.MathUtils.degToRad(
                event.alpha
            );

        const beta =
            THREE.MathUtils.degToRad(
                event.beta
            );

        const gamma =
            THREE.MathUtils.degToRad(
                event.gamma
            );


        // --------------------------------------------------------
        // Convert sensor angles → quaternion
        // --------------------------------------------------------

        euler.set(
            beta,
            alpha,
            -gamma,
            "YXZ"
        );


        deviceQuaternion.setFromEuler(
            euler
        );


        // --------------------------------------------------------
        // Device coordinates → Three.js coordinates
        // --------------------------------------------------------

        deviceQuaternion.multiply(
            DEVICE_TO_THREE
        );


        // --------------------------------------------------------
        // Screen orientation compensation
        // --------------------------------------------------------

        const screenAngle =
            THREE.MathUtils.degToRad(
                getScreenAngle()
            );


        screenQuaternion.setFromAxisAngle(
            SCREEN_AXIS,
            -screenAngle
        );


        deviceQuaternion.multiply(
            screenQuaternion
        );


        // --------------------------------------------------------
        // CALIBRATION
        // --------------------------------------------------------

        if (!calibrated) {

            calibrationQuaternion.copy(
                deviceQuaternion
            );

            inverseCalibration
                .copy(calibrationQuaternion)
                .invert();

            calibrated = true;
        }


        // --------------------------------------------------------
        // Orientation relative to starting position
        // --------------------------------------------------------

        relativeQuaternion
            .copy(inverseCalibration)
            .multiply(deviceQuaternion);


        // --------------------------------------------------------
        // REDUCE ROTATION SENSITIVITY
        //
        // Instead of applying the full rotation,
        // move only part-way from identity to the
        // measured orientation.
        //
        // Example:
        //
        // phone rotates 90°
        // sensitivity = 0.35
        //
        // model rotates approximately 31.5°
        // --------------------------------------------------------

        reducedQuaternion
            .copy(identityQuaternion)
            .slerp(
                relativeQuaternion,
                ROTATION_SENSITIVITY
            );


        targetQuaternion.copy(
            reducedQuaternion
        );


        // --------------------------------------------------------
        // SMOOTH MOVEMENT
        // --------------------------------------------------------

        phone.quaternion.slerp(
            targetQuaternion,
            SMOOTHING
        );


        // --------------------------------------------------------
        // SENSOR VALUES
        // --------------------------------------------------------

        alphaDisplay.textContent =
            Math.round(event.alpha) + "°";

        betaDisplay.textContent =
            Math.round(event.beta) + "°";

        gammaDisplay.textContent =
            Math.round(event.gamma) + "°";

        screenDisplay.textContent =
            getScreenAngle() + "°";
    }


    // ============================================================
    // ENABLE SENSOR
    // ============================================================

    async function enableOrientation() {

        try {

            if (
                typeof DeviceOrientationEvent ===
                "undefined"
            ) {

                throw new Error(
                    "Device orientation is not supported."
                );
            }


            /*
             * Some browsers require explicit permission.
             */

            if (
                typeof DeviceOrientationEvent
                    .requestPermission ===
                "function"
            ) {

                const permission =
                    await DeviceOrientationEvent
                        .requestPermission();


                if (
                    permission !== "granted"
                ) {

                    throw new Error(
                        "Motion permission was denied."
                    );
                }
            }


            // ----------------------------------------------------
            // Reset calibration when enabled
            // ----------------------------------------------------

            calibrated = false;


            window.addEventListener(
                "deviceorientation",
                updateDeviceQuaternion,
                true
            );


            enableButton.disabled = true;

            enableButton.textContent =
                "Motion Sensor Enabled";


            status.textContent =
                "Move your phone — rotation is intentionally reduced.";


        } catch (error) {

            console.error(error);

            status.textContent =
                error.message ||
                "Could not access the motion sensor.";
        }
    }


    enableButton.addEventListener(
        "click",
        enableOrientation
    );


    // ============================================================
    // RESIZE
    // ============================================================

    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }
    );


    // ============================================================
    // RENDER LOOP
    // ============================================================

    function animate() {

        requestAnimationFrame(
            animate
        );

        renderer.render(
            scene,
            camera
        );
    }


    animate();

</script>

</body>
</html>
