<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>3D Stars</title>

    <style>

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #02040a;
        }


        canvas {

            display: block;

            width: 100%;
            height: 100%;

            touch-action: none;
        }

    </style>

</head>


<body>


<script type="module">


    // ============================================================
    // THREE.JS
    // ============================================================

    import * as THREE from
        "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js";


    // ============================================================
    // SETTINGS
    // ============================================================

    /*
     * Physical phone rotation transferred to the star field.
     *
     * Lower = more subtle.
     */

    const ROTATION_SENSITIVITY = 0.30;


    /*
     * Rotation smoothness.
     *
     * Lower = smoother and slower.
     */

    const SMOOTHING = 0.16;


    /*
     * Number of stars.
     */

    const STAR_COUNT = 1800;


    /*
     * Size of the 3D star volume.
     */

    const STAR_RADIUS = 8.0;


    // ============================================================
    // SCENE
    // ============================================================

    const scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x02040a
        );


    // ============================================================
    // CAMERA
    // ============================================================

    const camera =
        new THREE.PerspectiveCamera(

            55,

            window.innerWidth /
            window.innerHeight,

            0.1,

            100
        );


    /*
     * Looking into a large 3D volume of stars.
     */

    camera.position.set(
        0,
        0,
        12
    );


    // ============================================================
    // RENDERER
    // ============================================================

    const renderer =
        new THREE.WebGLRenderer({

            antialias: true,

            powerPreference:
                "high-performance"
        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(

        window.innerWidth,
        window.innerHeight
    );


    document.body.appendChild(
        renderer.domElement
    );


    // ============================================================
    // STAR FIELD
    // ============================================================

    const starField =
        new THREE.Group();


    scene.add(
        starField
    );


    // ============================================================
    // STAR DATA
    // ============================================================

    const positions =
        new Float32Array(
            STAR_COUNT * 3
        );


    const sizes =
        new Float32Array(
            STAR_COUNT
        );


    const brightness =
        new Float32Array(
            STAR_COUNT
        );


    const twinkle =
        new Float32Array(
            STAR_COUNT
        );


    const phases =
        new Float32Array(
            STAR_COUNT
        );


    // ============================================================
    // GENERATE 3D STAR VOLUME
    // ============================================================

    for (
        let i = 0;
        i < STAR_COUNT;
        i++
    ) {


        const theta =
            Math.random() *
            Math.PI * 2;


        const phi =
            Math.acos(
                2 *
                Math.random() -
                1
            );


        /*
         * Cubic-root distribution gives a
         * natural volumetric density.
         */

        const radius =
            STAR_RADIUS *
            Math.cbrt(
                Math.random()
            );


        const sinPhi =
            Math.sin(phi);


        const x =
            radius *
            sinPhi *
            Math.cos(theta);


        const y =
            radius *
            sinPhi *
            Math.sin(theta);


        const z =
            radius *
            Math.cos(phi);


        positions[i * 3] =
            x;


        positions[i * 3 + 1] =
            y;


        positions[i * 3 + 2] =
            z;


        /*
         * Different intrinsic sizes.
         *
         * Most stars remain small.
         * A few are noticeably larger.
         */

        const sizeRandom =
            Math.random();


        sizes[i] =
            sizeRandom < 0.88

                ? 0.55 +
                  Math.random() * 1.1

                : 1.7 +
                  Math.random() * 2.0;


        /*
         * Different brightness values.
         */

        brightness[i] =
            0.40 +
            Math.random() *
            0.85;


        /*
         * Individual twinkle rates.
         */

        twinkle[i] =
            0.20 +
            Math.random() *
            1.30;


        /*
         * Different starting phases.
         */

        phases[i] =
            Math.random() *
            Math.PI * 2;
    }


    // ============================================================
    // BUFFER GEOMETRY
    // ============================================================

    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(

        "position",

        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    geometry.setAttribute(

        "aSize",

        new THREE.BufferAttribute(
            sizes,
            1
        )
    );


    geometry.setAttribute(

        "aBrightness",

        new THREE.BufferAttribute(
            brightness,
            1
        )
    );


    geometry.setAttribute(

        "aTwinkle",

        new THREE.BufferAttribute(
            twinkle,
            1
        )
    );


    geometry.setAttribute(

        "aPhase",

        new THREE.BufferAttribute(
            phases,
            1
        )
    );


    // ============================================================
    // STAR SHADER
    // ============================================================

    const starMaterial =
        new THREE.ShaderMaterial({

            transparent: true,

            depthWrite: false,

            depthTest: true,

            blending:
                THREE.AdditiveBlending,


            uniforms: {

                uTime: {
                    value: 0
                }

            },


            vertexShader: `

                uniform float uTime;

                attribute float aSize;
                attribute float aBrightness;
                attribute float aTwinkle;
                attribute float aPhase;

                varying float vBrightness;


                void main() {

                    vec4 mvPosition =
                        modelViewMatrix *
                        vec4(position, 1.0);


                    float depth =
                        max(
                            1.0,
                            -mvPosition.z
                        );


                    /*
                     * Very subtle individual
                     * brightness variation.
                     */

                    float sparkle =
                        0.90 +
                        0.10 *
                        sin(
                            uTime *
                            aTwinkle +
                            aPhase
                        );


                    /*
                     * Perspective depth.
                     *
                     * Nearby stars become larger.
                     */

                    float perspectiveSize =
                        46.0 /
                        depth;


                    gl_PointSize =
                        aSize *
                        perspectiveSize *
                        sparkle;


                    /*
                     * Keep giant foreground stars
                     * under control.
                     */

                    gl_PointSize =
                        min(
                            gl_PointSize,
                            20.0
                        );


                    vBrightness =
                        aBrightness *
                        sparkle;


                    gl_Position =
                        projectionMatrix *
                        mvPosition;
                }

            `,


            fragmentShader: `

                varying float vBrightness;


                void main() {

                    vec2 uv =
                        gl_PointCoord -
                        vec2(0.5);


                    float d =
                        length(uv);


                    /*
                     * Soft outer glow.
                     */

                    float glow =
                        1.0 -
                        smoothstep(
                            0.05,
                            0.5,
                            d
                        );


                    /*
                     * Small bright center.
                     */

                    float core =
                        1.0 -
                        smoothstep(
                            0.0,
                            0.13,
                            d
                        );


                    float alpha =
                        glow * 0.50 +
                        core * 0.50;


                    /*
                     * Mostly cool white,
                     * with a warm white core.
                     */

                    vec3 color =
                        mix(

                            vec3(
                                0.72,
                                0.84,
                                1.0
                            ),

                            vec3(
                                1.0,
                                0.98,
                                0.92
                            ),

                            core
                        );


                    color *=
                        vBrightness;


                    gl_FragColor =
                        vec4(

                            color,

                            alpha *
                            vBrightness
                        );
                }

            `
        });


    const stars =
        new THREE.Points(

            geometry,

            starMaterial
        );


    starField.add(
        stars
    );


    // ============================================================
    // QUATERNIONS
    // ============================================================

    const deviceQuaternion =
        new THREE.Quaternion();


    const calibrationQuaternion =
        new THREE.Quaternion();


    const inverseCalibration =
        new THREE.Quaternion();


    const relativeQuaternion =
        new THREE.Quaternion();


    const reducedQuaternion =
        new THREE.Quaternion();


    const euler =
        new THREE.Euler();


    const screenQuaternion =
        new THREE.Quaternion();


    const identityQuaternion =
        new THREE.Quaternion();


    const DEVICE_TO_THREE =
        new THREE.Quaternion(

            -Math.sqrt(0.5),

            0,

            0,

            Math.sqrt(0.5)
        );


    const SCREEN_AXIS =
        new THREE.Vector3(
            0,
            0,
            1
        );


    let calibrated =
        false;


    let sensorRunning =
        false;


    // ============================================================
    // SCREEN ORIENTATION
    // ============================================================

    function getScreenAngle() {

        if (

            screen.orientation &&

            typeof screen.orientation.angle ===
                "number"

        ) {

            return screen.orientation.angle;
        }


        if (

            typeof window.orientation ===
                "number"

        ) {

            return window.orientation;
        }


        return 0;
    }


    // ============================================================
    // CALCULATE DEVICE QUATERNION
    // ============================================================

    function handleOrientation(
        event
    ) {


        if (

            event.alpha === null ||

            event.beta === null ||

            event.gamma === null

        ) {

            return;
        }


        const alpha =
            THREE.MathUtils.degToRad(
                event.alpha
            );


        const beta =
            THREE.MathUtils.degToRad(
                event.beta
            );


        const gamma =
            THREE.MathUtils.degToRad(
                event.gamma
            );


        /*
         * Sensor angles → quaternion.
         *
         * The model is NOT rotated using
         * independent X/Y/Z Euler rotations.
         */

        euler.set(

            beta,

            alpha,

            -gamma,

            "YXZ"
        );


        deviceQuaternion
            .setFromEuler(
                euler
            );


        /*
         * Device coordinate system →
         * Three.js coordinate system.
         */

        deviceQuaternion.multiply(
            DEVICE_TO_THREE
        );


        /*
         * Compensate for portrait/
         * landscape orientation.
         */

        const screenAngle =
            THREE.MathUtils.degToRad(
                getScreenAngle()
            );


        screenQuaternion
            .setFromAxisAngle(

                SCREEN_AXIS,

                -screenAngle
            );


        deviceQuaternion.multiply(
            screenQuaternion
        );


        // ========================================================
        // CALIBRATION
        // ========================================================

        if (!calibrated) {

            calibrationQuaternion.copy(
                deviceQuaternion
            );


            inverseCalibration
                .copy(
                    calibrationQuaternion
                )
                .invert();


            calibrated = true;
        }


        /*
         * Orientation relative to the
         * initial phone position.
         */

        relativeQuaternion
            .copy(
                inverseCalibration
            )
            .multiply(
                deviceQuaternion
            );


        /*
         * Reduce the amount of physical
         * rotation transferred to the stars.
         */

        reducedQuaternion
            .copy(
                identityQuaternion
            )
            .slerp(

                relativeQuaternion,

                ROTATION_SENSITIVITY
            );


        /*
         * Smoothly approach the target.
         */

        starField.quaternion.slerp(

            reducedQuaternion,

            SMOOTHING
        );
    }


    // ============================================================
    // START SENSOR
    // ============================================================

    async function startSensor() {

        if (sensorRunning) {
            return;
        }


        if (
            typeof DeviceOrientationEvent ===
            "undefined"
        ) {

            return;
        }


        try {


            /*
             * Some browsers expose this permission API.
             *
             * Samsung Chrome normally doesn't require it.
             */

            if (

                typeof DeviceOrientationEvent
                    .requestPermission ===
                    "function"

            ) {


                /*
                 * This may require the user to
                 * interact with the page.
                 */

                const permission =
                    await DeviceOrientationEvent
                        .requestPermission();


                if (
                    permission !== "granted"
                ) {

                    return;
                }
            }


            calibrated =
                false;


            window.addEventListener(

                "deviceorientation",

                handleOrientation,

                true
            );


            sensorRunning =
                true;


        } catch (error) {

            /*
             * No visible UI.
             *
             * Useful information remains in console.
             */

            console.warn(
                "Motion sensor could not be enabled:",
                error
            );
        }
    }


    // ============================================================
    // START AUTOMATICALLY
    // ============================================================

    startSensor();


    /*
     * Some browsers require a user gesture before
     * requestPermission() can succeed.
     *
     * A completely invisible fallback:
     * touching the screen once starts the sensor.
     */

    window.addEventListener(

        "pointerdown",

        startSensor,

        {
            once: true,
            passive: true
        }
    );


    // ============================================================
    // RESIZE
    // ============================================================

    window.addEventListener(

        "resize",

        () => {

            camera.aspect =

                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(

                window.innerWidth,

                window.innerHeight
            );
        }
    );


    // ============================================================
    // ANIMATION
    // ============================================================

    const clock =
        new THREE.Clock();


    function animate() {


        requestAnimationFrame(
            animate
        );


        /*
         * Extremely subtle star twinkling.
         */

        starMaterial.uniforms.uTime.value =
            clock.getElapsedTime();


        renderer.render(

            scene,

            camera
        );
    }


    animate();


</script>

</body>

</html>
