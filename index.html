<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Orientation Test</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        #phone {
            width: 150px;
            height: 290px;
            margin: 80px auto 40px;

            border: 7px solid #ddd;
            border-radius: 28px;

            background: linear-gradient(
                145deg,
                #dfe4e8,
                #777
            );

            display: flex;
            align-items: center;
            justify-content: center;

            transform-style: preserve-3d;

            transition: transform 0.08s linear;

            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        #screen {
            width: 125px;
            height: 265px;

            border-radius: 20px;

            background: linear-gradient(
                145deg,
                #18202a,
                #53677a
            );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
            font-weight: bold;
        }

        #values {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px;
        }

        .value {
            background: #222;
            padding: 15px;
            border-radius: 10px;
            min-width: 70px;
        }

        button {
            padding: 15px 25px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <h1>Phone Orientation Test</h1>

    <div id="phone">
        <div id="screen">
            Leo
        </div>
    </div>

    <div id="values">

        <div class="value">
            Alpha<br>
            <strong id="alpha">0°</strong>
        </div>

        <div class="value">
            Beta<br>
            <strong id="beta">0°</strong>
        </div>

        <div class="value">
            Gamma<br>
            <strong id="gamma">0°</strong>
        </div>

    </div>

    <button id="start">
        Enable Phone Orientation
    </button>

    <div id="status">
        Open this page on your phone and press the button.
    </div>


    <script>

        const phone = document.getElementById("phone");

        const alphaDisplay =
            document.getElementById("alpha");

        const betaDisplay =
            document.getElementById("beta");

        const gammaDisplay =
            document.getElementById("gamma");

        const startButton =
            document.getElementById("start");

        const status =
            document.getElementById("status");


        function handleOrientation(event) {

            const alpha = event.alpha || 0;
            const beta = event.beta || 0;
            const gamma = event.gamma || 0;


            alphaDisplay.textContent =
                Math.round(alpha) + "°";

            betaDisplay.textContent =
                Math.round(beta) + "°";

            gammaDisplay.textContent =
                Math.round(gamma) + "°";


            /*
                Rotate the 3D phone.

                beta  = front/back tilt
                gamma = left/right tilt
                alpha = compass rotation
            */

            phone.style.transform =
                `perspective(700px)
                 rotateX(${-beta}deg)
                 rotateY(${gamma}deg)
                 rotateZ(${-alpha * 0.15}deg)`;
        }


        async function enableOrientation() {

            try {

                /*
                    iPhone/iPad require explicit permission.

                    Samsung/Android browsers normally
                    don't require this step.
                */

                if (
                    typeof DeviceOrientationEvent !==
                    "undefined" &&
                    typeof DeviceOrientationEvent.requestPermission ===
                    "function"
                ) {

                    const permission =
                        await DeviceOrientationEvent
                            .requestPermission();

                    if (permission !== "granted") {

                        throw new Error(
                            "Motion permission was not granted."
                        );
                    }
                }


                window.addEventListener(
                    "deviceorientation",
                    handleOrientation,
                    true
                );


                status.textContent =
                    "Sensor connected. Move your phone!";

                startButton.disabled = true;

                startButton.textContent =
                    "Orientation Enabled";

            }

            catch (error) {

                console.error(error);

                status.textContent =
                    error.message ||
                    "Could not access the orientation sensor.";
            }
        }


        startButton.addEventListener(
            "click",
            enableOrientation
        );

    </script>

</body>
</html>
